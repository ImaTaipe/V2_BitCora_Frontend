<div class="login-container">

  <div class="login-card">

    <div class="login-header">
      <h1 class="login-title">
        BitCoraPerú
      </h1>

      <p class="login-subtitle">
        Sistema de Gestión Bibliotecaria
      </p>
    </div>

    <div class="form-group">
      <label class="form-label">
        Correo electrónico
      </label>

      <input
        type="email"
        class="form-input"
        [ngModel]="correo()"
        (ngModelChange)="correo.set($event)">
    </div>

    <div class="form-group">
      <label class="form-label">
        Contraseña
      </label>

      <input
        type="password"
        class="form-input"
        [ngModel]="password()"
        (ngModelChange)="password.set($event)">
    </div>

    @if(error()) {
      <div class="error-box">
        {{ error() }}
      </div>
    }

    <button
      class="btn-modern login-button"
      (click)="iniciarSesion()">

      @if(loading()) {
        Ingresando...
      } @else {
        Iniciar Sesión
      }

    </button>

  </div>

</div>
