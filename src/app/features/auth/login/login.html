<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-4">
      <div class="card shadow">
        <div class="card-header">
          <h3>BitCoraPerú</h3>
        </div>
        <div class="card-body">
          <div class="mb-3">
            <label>Correo</label>
            <input
              type="email"
              class="form-control"
              [ngModel]="correo()"
              (ngModelChange)="correo.set($event)">
          </div>
          <div class="mb-3">
            <label>Contraseña</label>
            <input
              type="password"
              class="form-control"
              [ngModel]="password()"
              (ngModelChange)="password.set($event)">
          </div>
          @if(error()) {
            <div class="alert alert-danger">
              {{ error() }}
            </div>
          }
          <button
            class="btn btn-primary w-100"
            (click)="iniciarSesion()">
            @if(loading()) {
              Ingresando...
            } @else {
              Iniciar Sesión
            }
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
