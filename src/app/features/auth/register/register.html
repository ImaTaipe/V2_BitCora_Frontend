<div class="login-container">

  <div class="login-card">

    <div class="login-header">
      <h1 class="login-title">
        BitCoraPerú
      </h1>
      <p class="login-subtitle">
        Crear Cuenta
      </p>
    </div>

    <div class="form-group">
      <label class="form-label">Nombre completo</label>
      <input
        type="text"
        class="form-input"
        [ngModel]="nombreCompleto()"
        (ngModelChange)="nombreCompleto.set($event)">
    </div>

    <div class="form-group">
      <label class="form-label">Correo electrónico</label>
      <input
        type="email"
        class="form-input"
        [ngModel]="correo()"
        (ngModelChange)="correo.set($event)">
    </div>

    <div class="form-group">
      <label class="form-label">Contraseña</label>
      <input
        type="password"
        class="form-input"
        [ngModel]="password()"
        (ngModelChange)="password.set($event)">
    </div>

    <div class="form-group">
      <label class="form-label">Confirmar contraseña</label>
      <input
        type="password"
        class="form-input"
        [ngModel]="confirmarPassword()"
        (ngModelChange)="confirmarPassword.set($event)">
    </div>

    <div class="form-group">
      <label class="form-label">Teléfono</label>
      <input
        type="text"
        class="form-input"
        [ngModel]="telefono()"
        (ngModelChange)="telefono.set($event)">
    </div>

    <div class="form-group">
      <label class="form-label">Dirección</label>
      <input
        type="text"
        class="form-input"
        [ngModel]="direccion()"
        (ngModelChange)="direccion.set($event)">
    </div>

    @if(error()) {
      <div class="error-box">
        {{ error() }}
      </div>
    }

    <button
      class="btn-modern login-button"
      (click)="registrar()">
      Registrarse
    </button>

    <p class="text-center mt-3">
      ¿Ya tienes cuenta?
      <a routerLink="/login">
        Iniciar Sesión
      </a>
    </p>

  </div>

</div>
