<div class="perfil-container">

  <div class="card perfil-card">

    <div class="perfil-header">
      <h2 class="perfil-title">Registrar Nuevo Libro</h2>
    </div>

    <form (ngSubmit)="guardar()">

      <div class="form-group">
        <label class="form-label">Título</label>
        <input 
          type="text"
          class="form-input" 
          placeholder="Escribe el título del libro" 
          [(ngModel)]="libro.titulo" 
          name="titulo">
      </div>

      <div class="form-group">
        <label class="form-label">Autor</label>
        <input 
          type="text"
          class="form-input" 
          placeholder="Nombre del autor" 
          [(ngModel)]="libro.autor" 
          name="autor">
      </div>

      <div class="form-group">
        <label class="form-label">Editorial</label>
        <input 
          type="text"
          class="form-input" 
          placeholder="Nombre de la editorial" 
          [(ngModel)]="libro.editorial" 
          name="editorial">
      </div>

      <div class="form-group">
        <label class="form-label">Sinopsis</label>
        <textarea 
          class="form-input" 
          rows="3"
          placeholder="Breve resumen del libro..." 
          [(ngModel)]="libro.sinopsis" 
          name="sinopsis"></textarea>
      </div>

      <div class="form-group">
        <label class="form-label">ISBN</label>
        <input 
          type="text"
          class="form-input" 
          placeholder="Código ISBN (10 o 13 dígitos)" 
          [(ngModel)]="libro.isbn" 
          name="isbn"
          #isbnInput="ngModel"
          required
          maxlength="13"
          pattern="^(\d{10}|\d{13})$">
        
        @if (isbnInput.invalid && (isbnInput.dirty || isbnInput.touched)) {
          <div class="error-text">El ISBN debe tener exactamente 10 o 13 números.</div>
        }
      </div>

      <div class="form-group">
        <label class="form-label">Año de Publicación</label>
        <input 
          type="number" 
          class="form-input" 
          placeholder="Ej. 2026" 
          [(ngModel)]="libro.anio" 
          name="anio"
          #anioInput="ngModel"
          required
          min="1000"
          max="2099"
          oninput="if(this.value.length > 4) this.value = this.value.slice(0,4);">
        
        @if (anioInput.invalid && (anioInput.dirty || anioInput.touched)) {
          <div class="error-text">Ingrese un año válido.</div>
        }
      </div>

      <div class="form-group">
        <label class="form-label">Stock Disponible</label>
        <input 
          type="number" 
          class="form-input" 
          placeholder="Cantidad de unidades" 
          [(ngModel)]="libro.stock" 
          name="stock">
      </div>

      <div class="form-group">
        <label class="form-label">Imagen de Portada</label>
        
        @if (imagenPreview) {
          <div class="preview-wrapper">
            <img 
              [src]="imagenPreview" 
              class="preview-img" 
              alt="Vista previa de la portada"
            >
          </div>
        }

        <input 
          type="file" 
          class="form-input" 
          accept="image/*"
          (change)="onFileChange($event)">
      </div>

      <div class="actions-container">
        <button type="button" class="btn-modern btn-cancelar" routerLink="/libros">
          Cancelar
        </button>
        <button type="submit" class="btn-modern btn-guardar-verde">
          Guardar Libro
        </button>
      </div>

    </form>
  </div>
</div>
