<div class="container mt-4 d-flex justify-content-center">
  <div class="card p-4 shadow-sm" style="width: 100%; max-width: 550px;">
    <h3 class="text-center mb-4">📚 Registrar Nuevo Libro</h3>

    <form (ngSubmit)="guardar()">

      <div class="mb-3">
        <label class="form-label fw-bold">Título</label>
        <input 
          type="text"
          class="form-control" 
          placeholder="Escribe el título del libro" 
          [(ngModel)]="libro.titulo" 
          name="titulo">
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold">Autor</label>
        <input 
          type="text"
          class="form-control" 
          placeholder="Nombre del autor" 
          [(ngModel)]="libro.autor" 
          name="autor">
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold">Editorial</label>
        <input 
          type="text"
          class="form-control" 
          placeholder="Nombre de la editorial" 
          [(ngModel)]="libro.editorial" 
          name="editorial">
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold">Sinopsis</label>
        <textarea 
          class="form-control" 
          rows="3"
          placeholder="Breve resumen del libro..." 
          [(ngModel)]="libro.sinopsis" 
          name="sinopsis"></textarea>
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold">ISBN</label>
        <input 
          type="text"
          class="form-control" 
          placeholder="Código ISBN" 
          [(ngModel)]="libro.isbn" 
          name="isbn">
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold">Año de Publicación</label>
        <input 
          type="number" 
          class="form-control" 
          placeholder="Ej. 2026" 
          [(ngModel)]="libro.anio" 
          name="anio">
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold">Stock Disponible</label>
        <input 
          type="number" 
          class="form-control" 
          placeholder="Cantidad de unidades" 
          [(ngModel)]="libro.stock" 
          name="stock">
      </div>

      <div class="mb-4">
        <label class="form-label fw-bold">Imagen de Portada</label>
        <input 
          type="file" 
          class="form-control" 
          (change)="onFileChange($event)">
      </div>

      <div class="d-flex gap-2">
        <button type="button" class="btn btn-secondary w-50" routerLink="/libros">
          ❌ Cancelar
        </button>
        <button type="submit" class="btn btn-success w-50">
          💾 Guardar Libro
        </button>
      </div>

    </form>
  </div>
</div>
