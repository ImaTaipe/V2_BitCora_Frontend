<div class="container mt-4" style="max-width: 600px;">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>✏️ Editar Libro</h2>
    <a routerLink="/libros" class="btn btn-outline-primary btn-sm">
      📚 Volver al Catálogo
    </a>
  </div>

  <hr>

  @if (libro && libro.id) {
    
    <form (ngSubmit)="guardar()" class="card p-4 shadow-sm">

      <div class="mb-3">
        <label class="form-label fw-bold">Título del Libro</label>
        <input class="form-control" [(ngModel)]="libro.titulo" name="titulo">
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold">Autor</label>
        <input class="form-control" [(ngModel)]="libro.autor" name="autor">
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold">Editorial</label>
        <input class="form-control" [(ngModel)]="libro.editorial" name="editorial">
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold">Sinopsis</label>
        <textarea class="form-control" [(ngModel)]="libro.sinopsis" name="sinopsis" rows="3"></textarea>
      </div>

      <div class="row">
        <div class="col-md-6 mb-3">
          <label class="form-label fw-bold">ISBN</label>
          <input class="form-control" [(ngModel)]="libro.isbn" name="isbn">
        </div>
        <div class="col-md-6 mb-3">
          <label class="form-label fw-bold">Año de Publicación</label>
          <input type="number" class="form-control" [(ngModel)]="libro.anio" name="anio">
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold">Stock Disponible</label>
        <input type="number" class="form-control" [(ngModel)]="libro.stock" name="stock">
      </div>

      <div class="mb-4">
        <label class="form-label fw-bold">Actualizar Portada del Libro</label>
        
        <div class="mb-3 text-center">
          <img 
            [src]="imagenPreview || libro.urlImagen" 
            class="img-thumbnail shadow-sm" 
            style="height: 200px; object-fit: cover;"
            alt="Portada del libro"
          >
        </div>

        <input type="file" class="form-control" (change)="onFileChange($event)" accept="image/*">
        
        @if (!imagenPreview && libro.urlImagen) {
          <div class="form-text text-muted small mt-1">
            Ruta actual: <code>{{ libro.urlImagen }}</code>
          </div>
        } @else if (imagenPreview) {
          <div class="form-text text-success small mt-1">
            ✨ Nueva imagen seleccionada (Vista previa lista)
          </div>
        }
      </div>

      <div class="d-flex gap-2">
        <button type="button" class="btn btn-secondary w-50" routerLink="/libros">
          ❌ Cancelar
        </button>
        <button type="submit" class="btn btn-warning w-50">
          💾 Guardar cambios
        </button>
      </div>

    </form>

  } @else {
    <div class="text-center my-5">
      <div class="spinner-border text-warning" role="status"></div>
      <p class="mt-2 text-muted">Cargando datos del libro...</p>
    </div>
  }

</div>
