<div class="perfil-container">

  <div class="card perfil-card">

    <div class="perfil-header">
      <h2 class="perfil-title">Mi Perfil</h2>
    </div>

    <div class="form-group">
      <label class="form-label">Nombre Completo</label>
      <input
        type="text"
        class="form-input"
        [ngModel]="nombreCompleto()"
        (ngModelChange)="nombreCompleto.set($event)">
    </div>

    <div class="form-group">
      <label class="form-label">Correo electrónico</label>
      <input
        type="email"
        class="form-input input-readonly"
        [value]="correo()"
        readonly>
    </div>

    <div class="form-group">
      <label class="form-label">Teléfono</label>
      <input
        type="text"
        class="form-input"
        [ngModel]="telefono()"
        (ngModelChange)="telefono.set($event)">
    </div>

    <div class="form-group">
      <label class="form-label">Dirección</label>
      <textarea
        class="form-input textarea-input"
        rows="3"
        [ngModel]="direccion()"
        (ngModelChange)="direccion.set($event)">
      </textarea>
    </div>

    @if(mensaje()) {
      <div class="error-box success-box">
        {{ mensaje() }}
      </div>
    }

    <div class="actions-container">
      <button
        class="btn-modern"
        (click)="guardar()">
        Guardar Cambios
      </button>

      <button 
        class="btn-secundario" 
        (click)="abrirModal()">
        Cambiar Contraseña
      </button>
    </div>

  </div>

</div>

@if (mostrarModal()) {
  <div class="modal-overlay" (click)="cerrarModal()">
    <div class="modal-card" (click)="$event.stopPropagation()">
      
      <div class="modal-header">
        <h3>Cambiar Contraseña</h3>
        <button class="btn-close" (click)="cerrarModal()">&times;</button>
      </div>

      <div class="modal-body">
        <div class="form-group">
          <label class="form-label">Contraseña actual</label>
          <input
            type="password"
            class="form-input"
            [ngModel]="passwordActual()"
            (ngModelChange)="passwordActual.set($event)">
        </div>

        <div class="form-group">
          <label class="form-label">Nueva contraseña</label>
          <input
            type="password"
            class="form-input"
            [ngModel]="passwordNueva()"
            (ngModelChange)="passwordNueva.set($event)">
        </div>

        <div class="form-group">
          <label class="form-label">Confirmar contraseña</label>
          <input
            type="password"
            class="form-input"
            [ngModel]="confirmarPassword()"
            (ngModelChange)="confirmarPassword.set($event)">
        </div>

        @if(errorPassword()) {
          <div class="error-box">
            {{ errorPassword() }}
          </div>
        }

        @if(mensajePassword()) {
          <div class="error-box success-box">
            {{ mensajePassword() }}
          </div>
        }
      </div>

      <div class="modal-footer">
        <button class="btn-cancelar" (click)="cerrarModal()">Cancelar</button>
        <button class="btn-modern-modal" (click)="cambiarPassword()">Actualizar contraseña</button>
      </div>

    </div>
  </div>
}
