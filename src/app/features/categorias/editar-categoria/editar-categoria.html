<div class="perfil-container">

  <div class="card perfil-card">

    <div class="perfil-header">
      <h2 class="perfil-title">
        Editar Categoría
      </h2>
    </div>

    <form (ngSubmit)="guardar()">

      <div class="form-group">
        <label class="form-label">Nombre</label>

        <input
          type="text"
          class="form-input"
          [(ngModel)]="categoria.nombre"
          name="nombre">

          @if(errorNombre){
  <small class="error-text">
    {{ errorNombre }}
  </small>
}
      </div>

      <div class="form-group checkbox-group">
        <label class="checkbox-label">

          <input
            type="checkbox"
            [(ngModel)]="categoria.estado"
            name="estado">

          <span>Activa</span>

        </label>
      </div>

      <div class="actions-container">
        <button
    type="button"
    class="btn-modern btn-cancelar"
    (click)="cancelar()">

    Cancelar
  </button>

  <button
    type="submit"
    class="btn-modern btn-guardar-verde">

    Guardar
  </button>

      </div>

    </form>

  </div>

</div>
